<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF4F2; --surface:#FFFFFF; --ink:#1F2B45; --muted:#56627A; --line:#D3E1DE;
  --marigold:#F2A20C; --rani:#C93468; --peacock:#0E7A7E; --leaf:#3E8E3A;
  --good:#3E8E3A; --ok:#D98A00; --poor:#C93468;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Mukta", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A2B; --surface:#1B2539; --ink:#EAF0F7; --muted:#A9B4C7; --line:#2E3A52;
    --marigold:#F5B53A; --rani:#E0588A; --peacock:#45B5B7; --leaf:#6CC060;
    --good:#6CC060; --ok:#F5B53A; --poor:#E0588A;
  }
}
:root[data-theme="dark"]{
  --bg:#121A2B; --surface:#1B2539; --ink:#EAF0F7; --muted:#A9B4C7; --line:#2E3A52;
  --marigold:#F5B53A; --rani:#E0588A; --peacock:#45B5B7; --leaf:#6CC060;
  --good:#6CC060; --ok:#F5B53A; --poor:#E0588A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}

.app{max-width:1180px;margin:0 auto;padding:16px 16px 32px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1}
.brand svg{width:34px;height:34px}
.top .tagline{color:var(--muted);font-size:15px;text-align:right;max-width:24ch;line-height:1.3}

.layout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.stage,.panel{min-width:0}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start}
  .stage{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
}
.frame{border:3px solid #1F2B45;border-radius:28px;overflow:hidden;background:#BFE6EE;box-shadow:6px 6px 0 #1F2B45}
.frame svg{display:block;width:100%;height:auto}
.ticker{display:flex;align-items:stretch;background:#C93468;color:#fff;border-top:3px solid #1F2B45;height:38px;overflow:hidden}
.ticker .tag{flex:none;background:#1F2B45;color:#fff;font-family:var(--display);font-weight:700;font-size:15px;padding:0 12px;display:flex;align-items:center}
.ticker .track{flex:1;min-width:0;overflow:hidden;position:relative;display:flex;align-items:center}
.ticker .run{white-space:nowrap;display:inline-block;padding-left:100%;animation:marquee var(--dur,30s) linear infinite;font-weight:500;font-size:15px}
.ticker .run span{margin-right:44px}
.ticker .run span::before{content:"◆";color:#F5C518;margin-right:10px;font-size:11px;vertical-align:2px}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.hint{font-size:14px;color:var(--muted);margin:10px 4px 0;text-align:center}
@media (max-width:899px){
  body.checking .stage{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px}
  body.checking .frame{width:calc(max(38vh,250px) * 0.8333 + 6px);max-width:100%;margin:0 auto}
  body.checking .frame svg{height:max(38vh,250px);width:calc(max(38vh,250px) * 0.8333);max-width:100%}
  body.checking .hint{display:none}
}
@media (max-width:520px){.top .tagline{display:none}}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:24px 22px}
@media (min-width:520px){.panel{padding:30px 30px}}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
h1{font-size:clamp(34px,6vw,48px);font-weight:800;letter-spacing:-.015em}
h2{font-size:clamp(26px,4.4vw,34px);font-weight:800;letter-spacing:-.01em}
h3{font-size:20px;font-weight:700}
p{margin:0}
.lede{color:var(--muted);margin-top:10px;max-width:46ch}
.stack>*+*{margin-top:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-family:var(--display);font-weight:700;font-size:18px;border:2px solid #1F2B45;line-height:1.1;min-height:50px}
.btn.primary{background:var(--marigold);color:#1F2B45;box-shadow:3px 3px 0 #1F2B45}
.btn.primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1F2B45}
.btn.ghost{background:transparent;border-color:var(--ink)}
.btn.link{border:none;background:none;padding:6px 2px;min-height:0;font-size:16px;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.presets{display:grid;gap:10px}
.preset{display:flex;gap:14px;align-items:center;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.preset:hover{border-color:var(--peacock)}
.preset .emo{font-size:28px;line-height:1}
.preset b{font-family:var(--display);font-size:18px;display:block;line-height:1.2}
.preset small{color:var(--muted);font-size:14.5px;line-height:1.35;display:block}

.progress{display:flex;gap:6px}
.progress i{flex:1;height:7px;border-radius:7px;background:var(--line)}
.progress i.done{background:var(--peacock)}
.progress i.now{background:var(--marigold)}
.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;margin-top:10px}
.feeds{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);margin-top:8px}
.choices{display:grid;gap:10px;margin-top:18px;grid-template-columns:1fr 1fr}
.chip{display:block;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);font-size:17px;font-weight:500;line-height:1.3;min-height:56px;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--peacock)}
.chip[aria-pressed="true"]{background:var(--peacock);border-color:var(--peacock);color:#fff}
.reaction{min-height:52px;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--bg);font-weight:500;display:flex;align-items:center;gap:10px}
.reaction:empty{visibility:hidden}

.scoreline{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.score{font-family:var(--display);font-weight:800;font-size:76px;line-height:.85}
.score small{font-size:26px;color:var(--muted);font-weight:700}
.word{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;padding-bottom:6px}
.word span{display:block;font-family:var(--body);font-weight:500;font-size:15px;color:var(--muted)}
.mayor{background:#FFF2CC;color:#1F2B45;border:2px solid #1F2B45;border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.mayor .hat{font-size:30px;line-height:1}
.mayor h3{font-size:18px;margin-bottom:2px}
.news{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.news li{padding:10px 14px;border-radius:12px;background:var(--bg);font-weight:500;line-height:1.35}
.districts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.dbtn{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;min-height:56px}
.dbtn:hover{border-color:var(--peacock)}
.dbtn b{font-family:var(--display);font-weight:700;display:block;line-height:1.15;font-size:16px}
.dbtn small{color:var(--muted);font-size:13.5px;display:block;line-height:1.2}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid #1F2B45}
.dot.good{background:#4FB04A}.dot.ok{background:#F2B21C}.dot.poor{background:#E2486F}
.section-h{font-family:var(--display);font-weight:700;font-size:19px;margin-bottom:8px}
.banner{background:var(--bg);border-radius:14px;padding:10px 14px;font-size:15px;color:var(--muted)}

.week{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:520px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
.wday{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:6px;text-align:left}
.wday:hover{border-color:var(--peacock)}
.wday .mini-wrap{border-radius:11px;overflow:hidden;border:2px solid #1F2B45;background:#BFE6EE}
.wday .mini-wrap svg{display:block;width:100%;height:auto}
.wday .lab{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 2px;font-size:14px}
.wday .lab b{font-family:var(--display);font-size:16px}
.wday.empty .mini-wrap{display:flex;align-items:center;justify-content:center;aspect-ratio:400/480;background:var(--bg);border-style:dashed;border-color:var(--line);color:var(--muted);font-size:13px;text-align:center;padding:8px}

.foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;padding:0 4px}

.sheet-back{position:fixed;inset:0;background:rgba(15,22,38,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-back[hidden]{display:none}
.sheet{background:var(--surface);color:var(--ink);border:3px solid #1F2B45;border-radius:24px;max-width:520px;width:100%;padding:22px;box-shadow:6px 6px 0 #1F2B45;max-height:85vh;overflow:auto}
@media (min-width:700px){.sheet-back{align-items:center}}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet .close{border:2px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;font-size:20px;line-height:1;flex:none}
.sheet .state{display:inline-flex;align-items:center;gap:8px;font-weight:600;margin-top:10px}
.sheet h4{font-family:var(--display);font-size:17px;margin:16px 0 2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1F2B45;color:#fff;padding:10px 18px;border-radius:999px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  .ticker .run{animation:none;padding-left:14px}
  *{transition:none !important}
}

.tabs{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:4px;margin:-6px 0 22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:none;background:none;border-radius:999px;padding:9px 8px;font-family:var(--display);font-weight:700;font-size:14.5px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px #1F2B45}
.demo-bar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;background:#E3F3F1;color:#0B4F52;border:2px dashed #0E7A7E;border-radius:14px;padding:8px 12px;font-size:14.5px;margin:-4px 0 18px}
:root[data-theme="dark"] .demo-bar{background:#16353A;color:#BFECEA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .demo-bar{background:#16353A;color:#BFECEA}}
.demo-bar .btn.link{color:inherit;padding:2px}

.field{padding:14px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:none;padding-top:4px}
.field label,.field .flab{display:block;font-weight:600;line-height:1.3}
.field small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.stepper{display:flex;align-items:center;gap:12px;margin-top:10px}
.stepper button{width:52px;height:52px;border-radius:16px;border:2px solid #1F2B45;background:var(--surface);font-family:var(--display);font-size:28px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.stepper button:active{background:var(--bg)}
.stepper .val{min-width:96px;text-align:center;font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.stepper .val small{display:inline;font-size:16px;color:var(--muted);font-weight:600;margin-left:2px}
.stepper .tgt{font-size:14px;color:var(--muted);line-height:1.3}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.faces .chip,.three .chip{text-align:center;padding:8px 4px;min-height:64px;font-size:13.5px}
.faces .chip span{display:block;font-size:24px;line-height:1.2}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.three .chip{min-height:48px;font-size:15px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}

.vs{display:grid;gap:10px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;background:var(--surface);width:100%}
.vrow:hover{border-color:var(--peacock)}
.vrow b{font-family:var(--display);font-size:16px;line-height:1.2;display:flex;align-items:center;gap:8px}
.vrow .num{font-family:var(--display);font-weight:800;font-size:20px}
.vrow small{grid-column:1 / -1;color:var(--muted);font-size:14px;line-height:1.35}
.bar{grid-column:1 / -1;height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;border-radius:8px}
.insight{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:12px 14px;line-height:1.4}
.insight .ic{font-size:22px;line-height:1.2;flex:none}
.note{font-size:13.5px;color:var(--muted);line-height:1.4}
.src{font-size:13px;color:var(--muted);line-height:1.4;margin-top:4px}

.plan-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pbar{height:12px;border-radius:12px;background:var(--line);overflow:hidden;border:2px solid #1F2B45}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(45deg,#F5C518 0 10px,#F2A20C 10px 20px)}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.task.today{border-color:#1F2B45;box-shadow:3px 3px 0 #F2A20C}
.task.locked{opacity:.55}
.task .tick{width:34px;height:34px;flex:none;border-radius:10px;border:2px solid #1F2B45;background:var(--surface);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center}
.task .tick[aria-pressed="true"]{background:#4FB04A;color:#fff}
.task .tick:disabled{cursor:default;border-style:dashed}
.task .tx{line-height:1.35}
.task .tx small{display:block;color:var(--muted);font-size:13px}
.pick{display:grid;gap:8px;grid-template-columns:1fr 1fr}

.chat{position:relative;display:flex;flex-direction:column;gap:10px;max-height:min(52vh,460px);overflow-y:auto;padding:4px 2px;scroll-behavior:smooth}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.45;font-size:16px}
.msg.me{align-self:flex-end;background:#0E7A7E;color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--bg);border-bottom-left-radius:6px}
.msg.bot .who{font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);display:block;margin-bottom:2px}
.msg.bot p+p{margin-top:8px}
.suggest{display:flex;gap:8px;flex-wrap:wrap}
.suggest button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14.5px;line-height:1.2}
.suggest button:hover{border-color:var(--peacock)}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:2px solid #1F2B45;border-radius:999px;padding:12px 16px;font:inherit;background:var(--surface);color:var(--ink)}
.ask .btn{min-height:48px;padding:10px 18px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.switch input{width:18px;height:18px;accent-color:#0E7A7E}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" aria-label="Body City">
      <svg viewBox="0 0 34 34" aria-hidden="true"><rect x="1.5" y="1.5" width="31" height="31" rx="10" fill="#F2A20C" stroke="#1F2B45" stroke-width="3"/><path d="M7 26V15h6v11M14 26V9h7v17M22 26V13h5v13" fill="#fff" stroke="#1F2B45" stroke-width="2.4" stroke-linejoin="round"/><path d="M16.5 15.5c-1.6-1.4-.4-3 1-2 1.4-1 2.6.6 1 2l-1 .9z" fill="#C93468"/></svg>
      Body City
    </div>
    <p class="tagline">Your daily habits, built into a city</p>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Your city">
      <div class="frame">
        <div id="cityHost"></div>
        <div class="ticker" id="ticker" aria-hidden="true">
          <div class="tag">City News</div>
          <div class="track"><div class="run" id="tickerRun"></div></div>
        </div>
      </div>
      <p class="hint">Tap any part of the city to see what it means for your body.</p>
    </section>

    <section class="panel" id="panel" aria-live="polite"></section>
  </main>

  <footer class="foot">
    <span>Body City is for awareness, not medical advice. Your data stays on this device.</span>
    <button class="btn link" id="resetBtn" data-action="reset">Reset my city</button>
  </footer>
</div>

<div class="sheet-back" id="sheetBack" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
/* ---------- City SVG ---------- */
var INK="#1F2B45";
function auto(x,y,flip){
  var t = flip ? "translate("+(x+31)+","+y+") scale(-1,1)" : "translate("+x+","+y+")";
  return '<g transform="'+t+'"><rect x="5" y="-1" width="24" height="6" rx="2.5" fill="#F5C518" stroke="'+INK+'" stroke-width="1.2"/><path d="M2 14 Q2 5 9 5 L26 5 Q30 5 30 10 L30 16 L2 16 Z" fill="#2E9E5B" stroke="'+INK+'" stroke-width="1.2"/><rect x="18" y="7" width="9" height="5" rx="1" fill="#CFEAF0"/><circle cx="8" cy="17" r="3.4" fill="'+INK+'"/><circle cx="25" cy="17" r="3.4" fill="'+INK+'"/></g>';
}
function car(x,y,flip,col){
  var t = flip ? "translate("+(x+34)+","+y+") scale(-1,1)" : "translate("+x+","+y+")";
  return '<g transform="'+t+'"><path d="M8 7 L12 1 L24 1 L28 7 Z" fill="'+col+'" stroke="'+INK+'" stroke-width="1.2"/><rect x="1" y="6" width="33" height="10" rx="3" fill="'+col+'" stroke="'+INK+'" stroke-width="1.2"/><rect x="13" y="2.5" width="10" height="4" fill="#CFEAF0"/><circle cx="9" cy="17" r="3.4" fill="'+INK+'"/><circle cx="27" cy="17" r="3.4" fill="'+INK+'"/></g>';
}
function veh(i,x,y,flip){ var cols=["#E2486F","#3B82C4","#F2F2F2","#8E6CC8"]; return i%2===0 ? auto(x,y,flip) : car(x,y,flip,cols[i%4]); }

function crane(k,x,y){
  return '<g class="crane crane-'+k+'" transform="translate('+x+','+y+')"><path d="M-14 0 L-8 -10 L-2 0 Z M4 0 L10 -10 L16 0 Z" fill="#F28C28" stroke="'+INK+'" stroke-width="1"/>'+
  '<rect x="-3" y="-74" width="7" height="74" fill="#F5C518" stroke="'+INK+'" stroke-width="1.3"/>'+
  '<path d="M-3 -64 L4 -56 M4 -64 L-3 -56 M-3 -48 L4 -40 M4 -48 L-3 -40 M-3 -32 L4 -24 M4 -32 L-3 -24 M-3 -16 L4 -8 M4 -16 L-3 -8" stroke="'+INK+'" stroke-width=".8"/>'+

function lin(x, pts){
  if(x<=pts[0][0]) return pts[0][1];
  for(var i=1;i<pts.length;i++){ if(x<=pts[i][0]){ var a=pts[i-1], b=pts[i]; return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); } }
  return pts[pts.length-1][1];
}
function dscores(r){

    gut: Math.round(Math.min(r.veg/5,1)*45 + Math.min(r.protein/3,1)*35 + Math.max(0, 20-junkLoad)),
    water: Math.round(lin(r.water, [[0,0],[4,35],[6,65],[7,85],[8,100],[16,100]])),
    heart: Math.round(lin(r.move, [[0,0],[10,30],[20,60],[30,100],[300,100]])),
    mind: Math.round(((r.mood-1)*25)*0.7 + ({1:100,2:60,3:20}[Math.round(r.stress)]||60)*0.3),
    posture: Math.round(lin(r.sit, [[0.5,100],[1,90],[2,60],[3,40],[4,25],[6,5],[8,0]]))

}

/* ---------- Demo persona: 21 days of data with real patterns ---------- */
function rng(seed){ return function(){ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; }; }
function buildDemo(){
  var r=rng(42), out={}, t=todayKey();
  for(var i=20;i>=0;i--){
    var k=addDays(t,-i), wd=fromKey(k).getDay(), weekend=(wd===0||wd===6);
    var rec;
    if(weekend){
      rec={sleep:7.5+Math.round(r()*3)/2, veg:3+Math.floor(r()*3), protein:2+Math.floor(r()*2), junk:Math.floor(r()*2), chai:1+Math.floor(r()*2), water:5+Math.floor(r()*3), move:30+5*Math.floor(r()*8), sit:1+Math.round(r()*2)/2, mood:4+Math.floor(r()*2), stress:1};
    } else {
      var short = r()<0.7;
      rec={sleep: short?5+Math.round(r()*3)/2:7+Math.round(r()*2)/2, veg:1+Math.floor(r()*3), protein:1+Math.floor(r()*2), junk:1+Math.floor(r()*2), chai:2+Math.floor(r()*3), water:3+Math.floor(r()*3), move:5*Math.floor(r()*5), sit:3+Math.round(r()*4)/2, mood:2+Math.floor(r()*2), stress:2+Math.floor(r()*2)};
      if(!short){ rec.mood=Math.min(5,rec.mood+1); rec.junk=Math.max(0,rec.junk-1); rec.stress=Math.max(1,rec.stress-1); }
      if(wd===1){ rec.junk+=1; rec.mood=Math.max(1,rec.mood-1); }
    }
    out[k]=rec;
  }
  // chai and movement shape the next night's sleep
  var keys=Object.keys(out).sort();
  for(var j=0;j<keys.length-1;j++){
    var a=out[keys[j]], b=out[keys[j+1]];
    if(a.chai>=3) b.sleep=Math.max(4.5,b.sleep-1);
    if(a.move>=30) b.sleep=Math.min(9,b.sleep+0.5);
  }
  // the River repair plan is working: water rising over the last 4 days
  [3,2,1,0].forEach(function(n,i){ var k=addDays(t,-n); out[k].water=Math.max(out[k].water,5+i); });
  return out;
}

function window_(n){ var data=DATA(), t=todayKey(), out=[]; for(var i=n-1;i>=0;i--){ var k=addDays(t,-i); if(data[k]) out.push({k:k, r:data[k]}); } return out; }
function avgRec(list){ var a={}; Object.keys(DEF).forEach(function(f){ var s=0; list.forEach(function(x){s+=x.r[f];}); a[f]=list.length?s/list.length:DEF[f]; }); return a; }
function mean(arr){ return arr.reduce(function(a,b){return a+b;},0)/arr.length; }

function patterns(){
  var data=DATA(), keys=Object.keys(data).sort(), t=todayKey();
  keys=keys.filter(function(k){return diffDays(k,t)<28;});
  var out=[];
  function split(rows, cond, val){ var A=[],B=[]; rows.forEach(function(x){ (cond(x)?A:B).push(val(x)); }); return (A.length>=2&&B.length>=2)?{a:mean(A),b:mean(B),na:A.length,nb:B.length}:null; }
  var same=keys.map(function(k){return data[k];});
  var next=[]; for(var i=0;i<keys.length-1;i++){ if(diffDays(keys[i],keys[i+1])===1) next.push({today:data[keys[i]], next:data[keys[i+1]]}); }
  var p;
  p=split(same,function(r){return r.sleep<7;},function(r){return r.mood;});
  if(p && p.b-p.a>=0.6) out.push({w:(p.b-p.a)/1, d:["brain","mind"], ic:"🌫️", t:"After nights under 7 hours of sleep, your mood averaged "+n1(p.a)+"/5. After 7 or more hours, it was "+n1(p.b)+"/5."});
  p=split(same,function(r){return r.sleep<7;},function(r){return r.junk;});
  if(p && p.a-p.b>=0.7) out.push({w:(p.a-p.b)/1.2, d:["brain","gut"], ic:"🍩", t:"On days after short sleep you had "+n1(p.a)+" junk items, compared with "+n1(p.b)+" after a good night. Tired brains reach for quick sugar."});
  p=split(next,function(x){return x.today.chai>=3;},function(x){return x.next.sleep;});
  if(p && p.b-p.a>=0.5) out.push({w:(p.b-p.a)/0.8, d:["gut","brain"], ic:"☕", t:"Days with 3 or more sweet chais were followed by "+n1(p.a)+" hours of sleep. Lighter-chai days were followed by "+n1(p.b)+" hours."});
  p=split(next,function(x){return x.today.move>=30;},function(x){return x.next.sleep;});
  if(p && p.a-p.b>=0.5) out.push({w:(p.a-p.b)/0.8, d:["heart","brain"], ic:"🚶", t:"After days you moved 30 minutes or more, you slept "+n1(p.a)+" hours. After less active days, "+n1(p.b)+" hours."});
  p=split(same,function(r){return r.move>=30;},function(r){return r.mood;});
  if(p && p.a-p.b>=0.6) out.push({w:(p.a-p.b)/1, d:["heart","mind"], ic:"🌳", t:"On days you moved 30+ minutes, your mood averaged "+n1(p.a)+"/5, compared with "+n1(p.b)+"/5 on other days."});
  out.sort(function(a,b){return b.w-a.w;});
  return {list:out, n:keys.length};
}
function trends(){

  var recent=avgRec(w.slice(-3)), before=avgRec(w.slice(0,-3)), sr=dscores(recent), sb=dscores(before), out=[];

/* ---------- Mayor: on-device agent ---------- */
var KW = {
  brain:/sleep|slept|insomnia|night|bed ?time|nap|fog|tower|neend/,
  water:/water|drink|hydrat|thirst|river|paani|pani/,
  heart:/move|moving|walk|exercis|workout|gym|steps|active|power|lights|run|sport|yoga/,
  gut:/food|eat|diet|junk|sugar|chai|tea|coffee|protein|veg|sabzi|bazaar|snack|meal|crav|khaana|khana/,
  mind:/mood|stress|sad|anxi|happy|low|park|lonely|overwhelm|worr|tension/,
  posture:/sit|sitting|back|neck|posture|chair|desk|traffic|road|stiff/
};
var CRISIS=/suicid|kill myself|end my life|want to die|self.?harm|hurt myself|no reason to live/;
var MEDICAL=/chest pain|can'?t breathe|breathless|faint|unconscious|blood|seizure|high fever|stroke/;

function daysWord(n){ return n===1?"your one check-in":"your last "+n+" days"; }
function mayorStats(){
  var w=window_(7); if(!w.length) return null;
  var a=avgRec(w); return {w:w, a:a, s:dscores(a), pats:patterns().list, tr:trends()};
}
function localAnswer(q){
  var t=q.toLowerCase();
  if(CRISIS.test(t)) return ["I'm really glad you said something. You don't have to handle this alone. Please talk to someone right now: Tele-MANAS is free and open 24x7 at 14416 (or 1-800-891-4416). If you are in immediate danger, call 112.","If you can, also reach out to one person you trust and tell them how you're feeling."];
  if(MEDICAL.test(t)) return ["That sounds like something a doctor should look at, not a city mayor. If it's sudden or severe, call 112 or go to the nearest emergency department."];
  var st=mayorStats();

  if(/who are you|are you (an )?ai|how do you work|what can you do|^help/.test(t)) return ["I'm an on-device agent. I look at your check-ins, compare them with WHO and ICMR guidelines, look for patterns between your habits, and suggest one small next step. I run entirely on your phone, so your data never leaves it, and I don't need an account or the internet.","I'm not a doctor and can't diagnose anything, but I can tell you what your own numbers say."];
  if(/tired|exhaust|energy|sleepy|drained|thak|fatigue|lazy/.test(t)){
    var r=[], out=[];
    if(a.sleep<7) r.push("you're averaging "+n1(a.sleep)+" hours of sleep, below the 7-hour minimum");
    if(a.water<6) r.push("you're drinking about "+n1(a.water)+" glasses of water a day, and mild dehydration feels like tiredness");
    if(a.move<20) r.push("you're moving about "+Math.round(a.move)+" minutes a day; oddly, low activity makes you feel more tired, not less");
    if(a.chai>=3) r.push("you're having about "+n1(a.chai)+" sweet chais a day, and late caffeine and sugar dips can both hit your energy");
    if(r.length) out.push("Looking at "+daysWord(st.w.length)+", a few things stand out: "+r.join("; ")+".");

    var p=st.pats.filter(function(x){return x.d.indexOf("brain")>=0;})[0]; if(p) out.push("From your own data: "+p.t);
    out.push(r.length?"Start with the first one: "+D[a.sleep<7?"brain":a.water<6?"water":"heart"].tip:"");

    return out.filter(Boolean);
  }
  if(/weight|fat|lose|slim|diet plan|calorie/.test(t)) return ["Body City doesn't track weight, and I'd rather not guess at a number for you. What I can see is the two districts that matter most for it: your Bazaar ("+vtext("gut",a)+") and your Power Station ("+Math.round(a.move)+" min a day against a 30-minute guideline).","For a personal weight plan, a registered dietitian or doctor is the right person. Until then, more sabzi and dal, fewer packaged snacks, and a daily walk move both districts in the right direction."];
  if(/best day/.test(t)){ var bd=bestDay(); return [bd?bd.t+" That's your own recipe for a good day.":"I need a few more check-ins to pick your best day."]; }

    var out2=["Fix the "+D[k].place+" first. It has the biggest gap from its guideline. You're averaging "+vtext(k,a)+", and the guideline is "+D[k].target+"."];
    if(p2) out2.push("And it's connected to other parts of your city. "+p2.t);
    out2.push("One tiny step for tomorrow: "+PLANS[k][0]+" The Plan tab turns this into a 7-day repair, one small task a day.");
    out2.push("After that, look at the "+D[k2].place+" ("+vtext(k2,a)+").");
    return out2;
  }
  if(/how am i|how was|my week|summary|progress|doing|score|overall|report/.test(t)){
    var good=ORDER.filter(function(x){return stateOf(s[x])==="good";}), bad=ORDER.filter(function(x){return stateOf(s[x])==="poor";});
    var o=["Over "+daysWord(st.w.length)+", City Health averaged "+overall(s)+"/100."];
    if(good.length) o.push("Thriving: "+good.map(function(x){return D[x].place;}).join(", ")+".");
    if(bad.length) o.push("Struggling: "+bad.map(function(x){return D[x].place+" ("+vtext(x,a)+")";}).join("; ")+".");
    st.tr.forEach(function(x){o.push(x.t);});
    return o;
  }
  if(/chai|coffee|\btea\b|caffeine|sugar/.test(t)){
    var tsp=a.chai*1.5, pc=st.pats.filter(function(x){return x.ic==="☕";})[0];
    var oc=["You're having about "+n1(a.chai)+" cups of sweet chai or coffee a day. At 1 to 2 teaspoons each, that's roughly "+n1(tsp)+" teaspoons of sugar from chai alone, before any sweets or cold drinks. WHO suggests keeping added sugar ideally under about 6 teaspoons a day."];
    if(pc) oc.push("Your own data shows it affects your sleep too. "+pc.t);

  var inp=document.getElementById("askInput");
  if(inp) inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); ask(inp.value); } });
  var tg=document.getElementById("claudeToggle"); if(tg) tg.addEventListener("change",function(){ useClaude=tg.checked; });
}
function ask(q){
  q=(q||"").trim(); if(!q||chatBusy) return;
  chat.push({who:"me", text:q});
  var t=q.toLowerCase();
  if(useClaude && sampleNS && !CRISIS.test(t) && !MEDICAL.test(t)){
    chatBusy=true; var m={who:"mayor", parts:["Thinking…"]}; chat.push(m); render();
    askClaude(q).then(function(txt){ m.parts=txt.split(/\n\s*\n/).map(function(x){return x.trim();}).filter(Boolean); })
      .catch(function(){ m.parts=localAnswer(q); m.parts.push("(Claude wasn't available, so this answer came from the on-device Mayor.)"); })
      .then(function(){ chatBusy=false; if(tab==="mayor") render(); });
  } else {
    chat.push({who:"mayor", parts:localAnswer(q)}); render();
  }
  var inp=document.getElementById("askInput"); if(inp) inp.focus();
}
function askClaude(q){
  var st=mayorStats();
  var ctx={days_logged:st?st.w.length:0, averages_last_7_days:st?st.a:null, district_scores_0_100:st?st.s:null,
    patterns:st?st.pats.map(function(p){return p.t;}):[], trends:st?st.tr.map(function(p){return p.t;}):[],
    guidelines:ORDER.reduce(function(o,k){o[D[k].place+" ("+D[k].fed+")"]=D[k].guide+" Source: "+D[k].src; return o;},{})};
  var sys="You are the Mayor of Body City, a playful health app for young Indians where the user's body is a city (Control Tower=sleep, Bazaar=food, River=water, Power Station=movement, Park=mood, Roads=sitting). Answer the user's question using ONLY their data below and the guidelines. Use plain, simple English, under 110 words, 2 to 3 short paragraphs separated by blank lines, no markdown, no lists. Quote their actual numbers. End with one tiny, specific action. Never diagnose; for worrying symptoms suggest a doctor. Indian context (dal, sabzi, chai, katori).\n\nUSER DATA:\n"+JSON.stringify(ctx);
  var turns=[{role:"user",content:sys+"\n\nQUESTION: "+q}];
  return sampleNS(turns,{modelTier:"quick"}).then(function(r){ if(!r||!r.text) throw new Error("empty"); return r.text; });
}

/* ---------- District sheet ---------- */
var sheetBack=document.getElementById("sheetBack"), sheet=document.getElementById("sheet"), lastFocus=null;
function openDistrict(k){
  var d=D[k], data=DATA(), r=null;
  if(tab==="checkin" && draft) r=draft; else { var kk=(tab==="today"&&viewKey&&data[viewKey])?viewKey:(data[todayKey()]?todayKey():latestKey()); r=kk?data[kk]:null; }
  var st=r?stateOf(dscores(r)[k]):null;
  lastFocus=document.activeElement;
  sheet.innerHTML='<div class="head"><div><p class="note">'+esc(d.body)+', fed by '+esc(d.fed)+'</p><h2 id="sheetTitle">'+esc(d.place)+'</h2></div><button class="close" data-action="close" aria-label="Close">×</button></div>'+
    (st?'<p class="state"><span class="dot '+st+'" aria-hidden="true"></span>'+WORD[st]+': '+esc(vtext(k,r))+'</p>':'<p class="state note">Check in to see how this district is doing.</p>')+
    '<h4>The guideline</h4><p>'+esc(d.guide)+'</p><p class="src">Source: '+esc(d.src)+'</p>'+
    '<h4>What helps</h4><p>'+esc(d.tip)+'</p>';
  sheetBack.hidden=false; sheet.querySelector(".close").focus();
}
function closeSheet(){ sheetBack.hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
sheetBack.addEventListener("click",function(e){ if(e.target===sheetBack) closeSheet(); });
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&!sheetBack.hidden) closeSheet();
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("tg")){ e.preventDefault(); openDistrict(e.target.getAttribute("data-d")); }
});

var toastEl=document.getElementById("toast"), toastT=null;
function toast(msg){ toastEl.textContent=msg; toastEl.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){toastEl.hidden=true;},3200); }

/* ---------- Postcard ---------- */
function postcard(k){
  var r=DATA()[k]; if(!r||!downloads) return;
  var s=dscores(r), o=overall(s), st=stateOf(o), news=headlines(r);
  var m=city.cloneNode(true); m.classList.add("mini"); m.removeAttribute("data-focus");
  m.querySelectorAll(".tg").forEach(function(n){n.remove();});
  paint(m,r); m.setAttribute("width","800"); m.setAttribute("height","960");
  var img=new Image();
  img.onload=function(){
    var W=1600,H=1000,c=document.createElement("canvas"); c.width=W; c.height=H; var x=c.getContext("2d");
    x.fillStyle="#FFFBF0"; x.fillRect(0,0,W,H); x.strokeStyle="#1F2B45"; x.lineWidth=6; x.strokeRect(18,18,W-36,H-36);
    var ix=50,iy=56,iw=740,ih=888;
    x.save(); x.beginPath(); if(x.roundRect) x.roundRect(ix,iy,iw,ih,28); else x.rect(ix,iy,iw,ih); x.clip(); x.drawImage(img,ix,iy,iw,ih); x.restore();
    x.lineWidth=5; x.beginPath(); if(x.roundRect) x.roundRect(ix,iy,iw,ih,28); else x.rect(ix,iy,iw,ih); x.stroke();
    x.setLineDash([10,10]); x.lineWidth=3; x.strokeStyle="#C9C2B0"; x.beginPath(); x.moveTo(840,90); x.lineTo(840,910); x.stroke(); x.setLineDash([]);
    x.fillStyle="#F2A20C"; x.fillRect(1380,70,150,180); x.strokeStyle="#1F2B45"; x.lineWidth=4; x.strokeRect(1380,70,150,180);
    x.fillStyle="#1F2B45"; x.textAlign="center"; x.font='800 74px "Baloo 2", sans-serif'; x.fillText(String(o),1455,175);
    x.font='600 22px "Mukta", sans-serif'; x.fillText("City Health",1455,215); x.textAlign="left";
    x.fillStyle="#56627A"; x.font='500 38px "Mukta", sans-serif'; x.fillText("Greetings from",890,150);
    x.fillStyle="#1F2B45"; x.font='800 104px "Baloo 2", sans-serif'; x.fillText("Body City",882,250);
    x.fillStyle="#56627A"; x.font='500 32px "Mukta", sans-serif'; x.fillText(niceDate(k),890,310);
    x.fillStyle={good:"#3E8E3A",ok:"#C77F00",poor:"#C93468"}[st]; x.font='800 56px "Baloo 2", sans-serif'; x.fillText(WORD[st],890,420);
    x.fillStyle="#1F2B45"; x.font='700 30px "Baloo 2", sans-serif'; x.fillText("Today's headline",890,500);
    x.font='500 36px "Mukta", sans-serif'; wrap(x,"“"+news[0]+"”",890,550,640,48);
    x.fillStyle="#56627A"; x.font='500 26px "Mukta", sans-serif'; x.fillText("Build your own city, one habit at a time.",890,900);
    c.toBlob(function(b){
      if(!b){ toast("Couldn't create the postcard image."); return; }
      downloads.save({filename:"body-city-"+k+".png", data:b}).then(function(res){ if(res&&res.status==="saved") toast("Postcard saved."); })
      .catch(function(err){ var code=err&&err.code; if(code==="declined") return; if(code==="rate_limited"){ toast("A save prompt is already open."); return; } downloads=null; render(); toast("Postcards can't be saved in this view."); });
    },"image/png");
  };
  img.onerror=function(){ toast("Couldn't create the postcard image."); };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(m));
}
function wrap(ctx,text,x,y,maxW,lh){ var words=text.split(" "),line=""; for(var i=0;i<words.length;i++){ var tst=line?line+" "+words[i]:words[i]; if(ctx.measureText(tst).width>maxW&&line){ ctx.fillText(line,x,y); y+=lh; line=words[i]; } else line=tst; } if(line) ctx.fillText(line,x,y); }

/* ---------- Events ---------- */
var resetArmed=false, resetT=null;
document.addEventListener("click",function(e){
  var tg=e.target.closest&&e.target.closest(".tg,.d");
  if(tg&&city.contains(tg)){ openDistrict(tg.getAttribute("data-d")); return; }
  var b=e.target.closest&&e.target.closest("[data-action]"); if(!b) return;
  var a=b.getAttribute("data-action"), f=b.getAttribute("data-f");
  if(a==="start"){ var ex=DATA()[todayKey()]; draft=Object.assign({},DEF,ex||{}); step=0; tab="checkin"; render(); }
  else if(a==="cancel"){ tab="today"; render(); }
  else if(a==="next"){ if(step<5){ step++; render(); } else finish(); }
  else if(a==="prev"){ if(step>0){ step--; render(); } }
  else if(a==="inc"||a==="dec"){ var c=F[f]; draft[f]=Math.min(c.max,Math.max(c.min, Math.round((draft[f]+(a==="inc"?c.step:-c.step))*10)/10)); changed(f); }
  else if(a==="setf"){ draft[f]=+b.getAttribute("data-v"); changed(f); }
  else if(a==="demo"){ demo=true; DEMO={days:buildDemo(), plan:{d:"water", start:addDays(todayKey(),-3), done:[1,1,1,0,0,0,0]}}; chat=[]; tab="insights"; viewKey=null; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else if(a==="exitdemo"){ demo=false; chat=[]; tab="today"; viewKey=null; render(); }
  else if(a==="tab"){ tab=b.getAttribute("data-t"); if(tab==="today") viewKey=null; render(); }
  else if(a==="day"){ viewKey=b.getAttribute("data-k"); tab="today"; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else if(a==="district"){ openDistrict(b.getAttribute("data-d")); }
  else if(a==="close"){ closeSheet(); }
  else if(a==="postcard"){ postcard(b.getAttribute("data-k")); }
  else if(a==="startplan"){ setPlan({d:b.getAttribute("data-d"), start:todayKey(), done:[0,0,0,0,0,0,0]}); render(); toast("Cranes are up over the "+D[b.getAttribute("data-d")].place+"."); }
  else if(a==="newplan"){ setPlan(null); render(); }
  else if(a==="tick"){ var p=PLAN(), i=+b.getAttribute("data-i"); p.done[i]=p.done[i]?0:1; setPlan(p); render(); if(countDone(p)===7) toast("All 7 done. The "+D[p.d].place+" is rebuilt!"); }
  else if(a==="ask"){ ask(b.getAttribute("data-q")); }
  else if(a==="send"){ var inp=document.getElementById("askInput"); ask(inp&&inp.value); }
  else if(a==="reset"){
    if(!resetArmed){ resetArmed=true; b.textContent="Tap again to erase all your check-ins"; clearTimeout(resetT); resetT=setTimeout(function(){resetArmed=false;b.textContent="Reset my city";},4000); return; }
    resetArmed=false; b.textContent="Reset my city"; store={days:{},plan:null}; try{localStorage.removeItem(KEY);}catch(err){}
    demo=false; chat=[]; tab="today"; render(); toast("Your city has been reset.");
  }
});

/* ---------- Start ---------- */
render();
(function initCaps(){
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      window.claude.use("downloads").then(function(ns){ if(ns){ downloads=ns; if(tab==="today") render(); } }).catch(function(){});
      window.claude.use("sample").then(function(ns){ if(ns){ sampleNS=ns; if(tab==="mayor") render(); } }).catch(function(){});
    }
  }catch(e){}
})();

})();
</script>
